name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run on main so newly published package vulnerabilities surface without a code change.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --configuration Release

      # Fails when an entity or configuration changed without `dotnet ef migrations add`.
      - name: Check for missing EF migrations
        run: dotnet ef migrations has-pending-model-changes --project src/NpApi.Api --configuration Release --no-build

      # Integration tests start a throwaway Postgres container with Testcontainers; the hosted
      # runner has Docker. No secrets needed: tests sign their own JWTs instead of calling Auth0.
      - name: Test with coverage
        run: >
          dotnet test --no-build --configuration Release
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --coverage-settings coverage.config --results-directory TestResults

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: >
          dotnet reportgenerator -reports:"TestResults/**/*.cobertura.xml" -targetdir:coverage-report
          -reporttypes:"MarkdownSummaryGithub;JsonSummary;Html"

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage-report

      # Minimums are in scripts/check-coverage.sh (line 80%, branch 70%).
      - name: Enforce minimum coverage
        run: scripts/check-coverage.sh coverage-report/Summary.json

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Rules come from .editorconfig. Fix locally with `dotnet format`.
      - name: Verify formatting
        run: dotnet format --verify-no-changes

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Fails on High/Critical advisories (direct or transitive); lower severities are warnings.
      - name: Check for vulnerable packages
        run: scripts/check-vulnerable-packages.sh NpApi.slnx

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The same build that production deploys, loaded into the runner's Docker (not pushed).
      - name: Build production image
        run: >
          dotnet publish src/NpApi.Api --configuration Release -t:PublishContainer
          -p ContainerRepository=np-api -p ContainerImageTag=ci -p ContainerRuntimeIdentifier=linux-x64

      - name: Smoke test image
        run: scripts/smoke-test-image.sh np-api:ci

  terraform:
    name: Terraform checks (Auth0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/auth0
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      # Syntax and formatting only. No -backend and no provider credentials, so it never touches
      # the Auth0 tenant; plans and applies stay local (see docs/auth0-terraform.md).
      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
